<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DATABASE</title>
    <!-- טעינת Tailwind CSS לעיצוב ממשק המשתמש הצף -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- טעינת גופן Heebo לעברית נקייה ומודרנית ו-Space Grotesk לכיתוב DATABASE -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* הגדרות בסיס למניעת גלילה ובחירת טקסט בזמן משחק/נגיעה */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050811;
            font-family: 'Heebo', sans-serif;
            touch-action: none; /* מונע זום וגלילה במובייל בזמן החלקת אצבע */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* עיצוב ותגובתיות של הכיתוב המרכזי DATABASE */
        #center-logo {
            font-family: 'Space Grotesk', sans-serif;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), color 0.8s ease, text-shadow 0.8s ease;
        }
    </style>
</head>
<body class="relative text-white">

    <!-- קנבס ראשי לאנימציה -->
    <canvas id="canvas"></canvas>

    <!-- כיתוב DATABASE מרכזי מעוצב שמגיב לנגיעות ולשינויי אווירה -->
    <div id="logo-container" class="pointer-events-none absolute inset-0 flex items-center justify-center z-10 px-4">
        <div class="relative flex flex-col items-center">
            <h1 id="center-logo" dir="ltr" class="text-5xl sm:text-7xl md:text-8xl font-bold tracking-[0.28em] text-cyan-200/80 select-none" style="text-shadow: 0 0 30px rgba(34, 211, 238, 0.45);">
                DATABASE
            </h1>
            <div id="logo-line" class="h-[2px] w-24 sm:w-36 mt-3 rounded-full bg-cyan-400/60 transition-all duration-500 shadow-[0_0_12px_#22d3ee]"></div>
        </div>
    </div>

    <!-- בר שליטה צף ומינימליסטי בתחתית המסך -->
    <div id="controls" class="z-20 absolute bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-2 sm:gap-3 px-4 py-2.5 rounded-full bg-white/5 backdrop-blur-md border border-white/10 shadow-2xl transition-opacity duration-500 hover:opacity-100 opacity-75">
        
        <!-- כפתור החלפת ערכת צבעים -->
        <button id="theme-btn" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-white/10 hover:bg-white/20 active:scale-95 transition-all cursor-pointer" title="החלף אווירה">
            <span id="theme-dot" class="w-3 h-3 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee]"></span>
            <span id="theme-name">זוהר צפוני</span>
        </button>

        <!-- כפתור מצב טיפות גשם אוטומטיות (שומר מסך) -->
        <button id="auto-btn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-cyan-500/20 text-cyan-200 border border-cyan-500/30 hover:bg-cyan-500/30 active:scale-95 transition-all cursor-pointer" title="טיפות אוטומטיות">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
            </svg>
            <span>גשם: פעיל</span>
        </button>

        <!-- כפתור סאונד (Web Audio API מובנה ללא צורך בקבצים חיצוניים) -->
        <button id="sound-btn" class="p-2 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 transition-all text-slate-300 cursor-pointer" title="הפעל/השתק צלילים">
            <!-- אייקון מושתק כברירת מחדל -->
            <svg id="sound-icon-off" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
            </svg>
            <!-- אייקון פעיל -->
            <svg id="sound-icon-on" class="w-4 h-4 hidden text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
            </svg>
        </button>
    </div>

    <script>
        /**
         * אדוות אור - שומר מסך אינטראקטיבי
         * משלב אפקט אדוות מים, חלקיקי אור מרחפים, וסאונד פנטטוני עדין
         */

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const centerLogo = document.getElementById('center-logo');
        const logoLine = document.getElementById('logo-line');

        // משתני מצב גלובליים
        let width, height;
        let ripples = [];
        let particles = [];
        let isAutoRain = true;
        let soundEnabled = false;
        let audioCtx = null;
        let logoPulseTimeout = null;

        // ערכות נושא (צבעי רקע, אדוות וחלקיקים)
        const themes = [
            {
                name: 'זוהר צפוני',
                dotColor: '#22d3ee',
                logoColor: 'rgba(165, 243, 252, 0.85)',
                logoGlow: 'rgba(34, 211, 238, 0.5)',
                bgTop: '#040914',
                bgBottom: '#09192f',
                colors: ['#22d3ee', '#34d399', '#818cf8', '#38bdf8']
            },
            {
                name: 'שקיעה חמה',
                dotColor: '#fb7185',
                logoColor: 'rgba(254, 205, 211, 0.85)',
                logoGlow: 'rgba(251, 113, 133, 0.5)',
                bgTop: '#120611',
                bgBottom: '#290d1e',
                colors: ['#fb7185', '#f472b6', '#fbbf24', '#c084fc']
            },
            {
                name: 'יער קסום',
                dotColor: '#a3e635',
                logoColor: 'rgba(217, 249, 157, 0.85)',
                logoGlow: 'rgba(163, 230, 53, 0.5)',
                bgTop: '#05100a',
                bgBottom: '#0b2416',
                colors: ['#a3e635', '#34d399', '#2dd4bf', '#fde047']
            },
            {
                name: 'זהב מלכותי',
                dotColor: '#facc15',
                logoColor: 'rgba(254, 240, 138, 0.85)',
                logoGlow: 'rgba(250, 204, 21, 0.5)',
                bgTop: '#0a0908',
                bgBottom: '#1c1813',
                colors: ['#facc15', '#fb923c', '#fef08a', '#e2e8f0']
            }
        ];
        let currentThemeIndex = 0;

        // תדרים של סולם פנטטוני מרגיע (C Major Pentatonic)
        const pentatonicNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

        /**
         * התאמת גודל הקנבס למסך בצורה רספונסיבית (כולל מסכי Retina/DPI גבוה)
         */
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        /**
         * מחלקת אדווה (Ripple) - מעגלי אור מתרחבים ונעלמים בהדרגה
         */
        class Ripple {
            constructor(x, y, maxRadius = null, isDrag = false) {
                this.x = x;
                this.y = y;
                this.radius = isDrag ? 2 : 5;
                this.maxRadius = maxRadius || (Math.min(width, height) * (0.22 + Math.random() * 0.15));
                this.speed = isDrag ? 2.5 : (2.2 + Math.random() * 1.2);
                this.alpha = isDrag ? 0.65 : 0.9;
                this.lineWidth = isDrag ? 2 : 3;
                const palette = themes[currentThemeIndex].colors;
                this.color = palette[Math.floor(Math.random() * palette.length)];
            }

            update() {
                this.radius += this.speed;
                // האטה הדרגתית ככל שהאדווה גדלה לתחושה טבעית של מים
                this.speed *= 0.985;
                const progress = this.radius / this.maxRadius;
                this.alpha = Math.max(0, (1 - progress) * 0.85);
            }

            draw() {
                if (this.alpha <= 0.01) return;
                ctx.save();
                
                // טבעת חיצונית זוהרת
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.lineWidth = this.lineWidth;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.stroke();

                // טבעת פנימית עדינה ליצירת עומק של אדווה כפולה
                if (this.radius > 18) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 0.65, 0, Math.PI * 2);
                    ctx.globalAlpha = this.alpha * 0.45;
                    ctx.lineWidth = this.lineWidth * 0.6;
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        /**
         * מחלקת חלקיק אור (Particle) - ניצוצות עדינים ברקע ובזמן נגיעה
         */
        class Particle {
            constructor(x, y, isBurst = false) {
                this.x = x ?? Math.random() * width;
                this.y = y ?? Math.random() * height;
                this.isBurst = isBurst;
                const angle = Math.random() * Math.PI * 2;
                const speed = isBurst ? (0.8 + Math.random() * 2.5) : (0.15 + Math.random() * 0.35);
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - (isBurst ? 0 : 0.15);
                this.size = isBurst ? (1.5 + Math.random() * 2.5) : (1 + Math.random() * 2);
                this.alpha = isBurst ? 0.95 : (0.2 + Math.random() * 0.5);
                this.decay = isBurst ? (0.015 + Math.random() * 0.015) : 0;
                const palette = themes[currentThemeIndex].colors;
                this.color = palette[Math.floor(Math.random() * palette.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.isBurst) {
                    this.vx *= 0.96;
                    this.vy *= 0.96;
                    this.alpha -= this.decay;
                } else {
                    // החזרה לצד השני של המסך עבור חלקיקי האווירה הקבועים
                    if (this.x < 0) this.x = width;
                    if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height;
                    if (this.y > height) this.y = 0;
                }
            }

            draw() {
                if (this.alpha <= 0.01) return;
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // אתחול חלקיקי רקע מרחפים לאווירה רגועה
        function initAmbientParticles() {
            particles = [];
            const count = Math.min(45, Math.floor((width * height) / 22000));
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(null, null, false));
            }
        }
        initAmbientParticles();

        /**
         * סינתיסייזר צלילי מים עדינים (Web Audio API)
         */
        function playWaterChime(xRatio) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                // בחירת תו לפי מיקום הנגיעה לרוחב המסך
                const noteIndex = Math.min(
                    pentatonicNotes.length - 1,
                    Math.max(0, Math.floor((xRatio / width) * pentatonicNotes.length))
                );
                const freq = pentatonicNotes[noteIndex];

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                // החלקת תדר קלה המדמה טיפת מים
                osc.frequency.exponentialRampToValueAtTime(freq * 1.015, audioCtx.currentTime + 0.15);

                gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 1.45);
            } catch (e) {
                // התעלמות שקטה במידה והדפדפן חוסם אודיו
            }
        }

        /**
         * תגובה ויזואלית של הכיתוב DATABASE בעת נגיעה או שינוי
         */
        function pulseCenterLogo(x, y, isDrag = false) {
            const theme = themes[currentThemeIndex];
            // חישוב הטיה קלה לכיוון הנגיעה לתחושת תלת-ממד ועומק
            const offsetX = ((x / width) - 0.5) * (isDrag ? 10 : 18);
            const offsetY = ((y / height) - 0.5) * (isDrag ? 10 : 18);
            const scale = isDrag ? 1.03 : 1.08;

            centerLogo.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            centerLogo.style.textShadow = `0 0 45px ${theme.dotColor}, 0 0 15px #ffffff`;
            logoLine.style.width = isDrag ? '10rem' : '14rem';
            logoLine.style.backgroundColor = theme.dotColor;

            clearTimeout(logoPulseTimeout);
            logoPulseTimeout = setTimeout(() => {
                centerLogo.style.transform = 'translate(0px, 0px) scale(1)';
                centerLogo.style.textShadow = `0 0 30px ${theme.logoGlow}`;
                logoLine.style.width = '';
            }, 350);
        }

        /**
         * יצירת אינטראקציה בנקודה מסוימת (אדווה + ניצוצות + צליל)
         */
        function triggerInteraction(x, y, isDrag = false) {
            pulseCenterLogo(x, y, isDrag);

            ripples.push(new Ripple(x, y, isDrag ? 80 : null, isDrag));

            // יצירת ניצוצות אור קטנים
            const burstCount = isDrag ? 2 : 6;
            for (let i = 0; i < burstCount; i++) {
                particles.push(new Particle(x, y, true));
            }

            if (!isDrag || Math.random() > 0.75) {
                playWaterChime(x);
            }
        }

        // ניהול אירועי עכבר וטאץ' (מולטי-טאץ' מלא!)
        let isMouseDown = false;
        let lastDragTime = 0;

        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            triggerInteraction(e.clientX, e.clientY, false);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            const now = Date.now();
            if (now - lastDragTime > 35) { // הגבלת קצב לשמירה על ביצועים חלקים
                triggerInteraction(e.clientX, e.clientY, true);
                lastDragTime = now;
            }
        });

        window.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        // תמיכה במגע (Touch) - כולל מספר אצבעות במקביל
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                triggerInteraction(touch.clientX, touch.clientY, false);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const now = Date.now();
            if (now - lastDragTime > 35) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    triggerInteraction(touch.clientX, touch.clientY, true);
                }
                lastDragTime = now;
            }
        }, { passive: false });

        /**
         * לולאת האנימציה הראשית
         */
        let lastAutoDrop = 0;
        function animate(timestamp) {
            const theme = themes[currentThemeIndex];

            // ציור רקע גרדיאנט עמוק עם אפקט שובל עדין
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, theme.bgTop);
            gradient.addColorStop(1, theme.bgBottom);
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // מצב שומר מסך: טיפות גשם אוטומטיות אקראיות
            if (isAutoRain && timestamp - lastAutoDrop > 900 + Math.random() * 1400) {
                const rx = Math.random() * width;
                const ry = Math.random() * height;
                ripples.push(new Ripple(rx, ry, 110 + Math.random() * 80, false));
                lastAutoDrop = timestamp;
            }

            // עדכון וציור חלקיקים
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.isBurst && p.alpha <= 0.01) {
                    particles.splice(i, 1);
                }
            }

            // עדכון וציור אדוות
            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                r.update();
                r.draw();
                if (r.alpha <= 0.01) {
                    ripples.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // --- חיבור כפתורי הממשק ---

        // החלפת ערכת צבעים
        const themeBtn = document.getElementById('theme-btn');
        const themeDot = document.getElementById('theme-dot');
        const themeName = document.getElementById('theme-name');

        themeBtn.addEventListener('click', () => {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const newTheme = themes[currentThemeIndex];
            themeDot.style.backgroundColor = newTheme.dotColor;
            themeDot.style.boxShadow = `0 0 8px ${newTheme.dotColor}`;
            themeName.textContent = newTheme.name;

            // התאמת צבע הכיתוב DATABASE והקו שמתחתיו לערכת הנושא החדשה
            centerLogo.style.color = newTheme.logoColor;
            centerLogo.style.textShadow = `0 0 30px ${newTheme.logoGlow}`;
            logoLine.style.backgroundColor = newTheme.dotColor;
            logoLine.style.boxShadow = `0 0 12px ${newTheme.dotColor}`;
            
            // עדכון צבעי חלקיקי הרקע הקיימים
            particles.forEach(p => {
                if (!p.isBurst) {
                    p.color = newTheme.colors[Math.floor(Math.random() * newTheme.colors.length)];
                }
            });
            // יצירת אדווה במרכז המסך להמחשת הצבע החדש
            triggerInteraction(width / 2, height / 2, false);
        });

        // הפעלה/כיבוי של טיפות גשם אוטומטיות
        const autoBtn = document.getElementById('auto-btn');
        autoBtn.addEventListener('click', () => {
            isAutoRain = !isAutoRain;
            const label = autoBtn.querySelector('span');
            if (isAutoRain) {
                label.textContent = 'גשם: פעיל';
                autoBtn.classList.add('bg-cyan-500/20', 'text-cyan-200', 'border-cyan-500/30');
                autoBtn.classList.remove('bg-white/10', 'text-slate-300', 'border-transparent');
            } else {
                label.textContent = 'גשם: כבוי';
                autoBtn.classList.remove('bg-cyan-500/20', 'text-cyan-200', 'border-cyan-500/30');
                autoBtn.classList.add('bg-white/10', 'text-slate-300', 'border-transparent');
            }
        });

        // הפעלה/השתקה של הסאונד
        const soundBtn = document.getElementById('sound-btn');
        const soundIconOff = document.getElementById('sound-icon-off');
        const soundIconOn = document.getElementById('sound-icon-on');

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundIconOff.classList.add('hidden');
                soundIconOn.classList.remove('hidden');
                playWaterChime(width / 2); // השמעת צליל אישור
            } else {
                soundIconOff.classList.remove('hidden');
                soundIconOn.classList.add('hidden');
            }
        });

        // התחלת האנימציה בטעינת החלון
        window.onload = function() {
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
